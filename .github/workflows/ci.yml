name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Formatting first: it is the cheapest failure to fix.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # `cargo test --workspace` above builds every crate with DEFAULT features, so
  # molao-dist's `transport::iroh` module — and the one test in it — is never
  # compiled there, let alone run. A feature-gated module nothing in CI touches
  # is a module that rots quietly, so it gets its own job rather than a note in
  # a doc comment.
  dist-iroh:
    name: molao-dist (iroh feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The iroh test runs two endpoints in one process over a loopback socket,
      # with relaying and address discovery disabled. It needs no Internet
      # access at run time.
      - name: Test
        run: cargo test -p molao-dist --features iroh

      - name: Clippy
        run: cargo clippy -p molao-dist --features iroh --all-targets -- -D warnings

      # State the limits of what just passed, in the log, where somebody reading
      # a green tick will see it.
      - name: What this job does not verify
        run: |
          echo "::notice title=iroh coverage::molao-dist's iroh transport is exercised \
          only over a same-host loopback connection with relaying and address discovery \
          disabled. NAT traversal, relay fallback and wide-area address lookup are NOT \
          verified by this job, and nothing in the workspace depends on molao-dist at all."

  web:
    name: Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The UI is built by a separate workstream; skip cleanly rather than
      # failing the run when apps/web is not present in this revision.
      - name: Detect web UI
        id: detect
        run: |
          if [ -f apps/web/package.json ] && [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "apps/web not present in this revision — skipping web job."
          fi

      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: npm ci

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: npm run build

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: npm run typecheck

  # Every command in a README or docs page has to actually work from a clean
  # clone. This checks the cheap half of that: no doc links into the void.
  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # site/ is excluded: its markdown is a flattened copy of the repo docs,
      # and docs.html rewrites cross-document links client-side.
      - name: Check relative links in markdown resolve
        run: |
          st=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            for link in $(grep -oE '\]\([^)#:]+\.md(#[^)]*)?\)' "$file" 2>/dev/null \
                          | sed -E 's/^\]\(//; s/\)$//; s/#.*$//'); do
              if [ ! -e "$dir/$link" ]; then
                echo "::error file=$file::broken link to $link"
                st=1
              fi
            done
          done < <(find . -name '*.md' \
                        -not -path './node_modules/*' \
                        -not -path './target/*' \
                        -not -path './site/*')
          exit $st

      # The mini-site's markdown is a generated mirror of the canonical docs.
      # It has drifted before -- a refactor updated docs/COURTS.md and left
      # site/docs/courts.md telling readers the feature was unimplemented.
      - name: Check site/docs mirror is in sync
        run: node scripts/sync-site-docs.mjs --check

  # scripts/verify.sh is what a user runs before executing a release binary.
  # Its 24 synthetic-origin cases assert, for each way a release can be wrong
  # (manifest 404, HTML error page served as the manifest, empty/garbage
  # manifest, no entry for the asset, the two name-matching traps, artifact
  # 404, truncated download, digest mismatch, missing tools), both the exit
  # code and that a diagnostic was actually printed. It runs on every push
  # because a checksum guard that has quietly stopped failing is, from a green
  # CI run, indistinguishable from one that works.
  verify-script:
    name: verify.sh selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify.sh --selftest

  # The landing page and docs are rendered in a real browser at eight viewports
  # in both colour schemes. None of what this catches survives a diff: a
  # stretched screenshot, an off-theme capture, body copy under 12px, an element
  # pushing the page sideways, a dead anchor, an unhighlighted code block.
  site-render:
    name: site/ renders correctly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          cd scripts
          npm install --silent
          npx --yes playwright install --with-deps chromium

      # Self-test first: it breaks each invariant on purpose and demands the
      # check notice. A gate that has stopped discriminating looks exactly like
      # one that passes, so a silent gate must fail the build.
      - name: Gate self-test
        run: node scripts/check-render.mjs --selftest

      - name: Render checks
        run: node scripts/check-render.mjs
